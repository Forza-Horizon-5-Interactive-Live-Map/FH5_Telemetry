name: ForzaLiveTelemetry
services:
  Database:
      container_name: Database
      restart: unless-stopped
      image: postgres:latest
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: MySecretVeryStrongPassword123!
        POSTGRES_DB: LiveMap
      ports:
        - name: Database
          host_ip: 127.0.0.1
          published: 5432
          target: 5432
          protocol: tcp
          mode: host
      volumes:
        - db_data:/var/lib/postgresql/data
      networks:
        - forzalivetelemetry
  
  API:
    container_name: API
    depends_on:
      Database:
        condition: service_started
        restart: false
    image: forzalive/api
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - name: WebSocket
        host_ip: 127.0.0.1
        target: 8080
        published: 32770
        protocol: tcp
        mode: host
      - name: Telemetry
        host_ip: 127.0.0.1
        target: 5690
        published: 5690
        protocol: udp
        mode: host
    networks:
      - forzalivetelemetry

networks:
  forzalivetelemetry:

volumes:
  db_data: